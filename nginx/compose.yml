services:
  nginx:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-pm
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ../data/nginx/data:/data
      - ../data/nginx/letsencrypt:/etc/letsencrypt
      # for using a conf file instead of the interface
      # - ../data/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      proxy: null

      # for legacy services deployed on the server not yet migrated
      cityplaza:
        ipv4_address: 192.168.2.201
    ports:
      - 80:80
      - 81:81
      - 443:443

  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: cloudflared
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run
  #   networks:
  #     proxy: null
  #   environment:
  #     - TUNNEL_TOKEN=${TUNNEL_TOKEN}

networks:
  proxy: 
    external: true
  
  # for legacy services deployed on the server not yet migrated
  cityplaza:
    external: true